name: Source Anime Rain Assets
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      providers:
        description: 'Source video, audio, or both'
        type: choice
        options: [video, audio, both]
        default: video
      limit:
        description: 'Maximum new files per provider (1–7)'
        type: choice
        options: ['1', '3', '7']
        default: '3'
permissions:
  contents: read
concurrency:
  group: private-asset-sourcing
  cancel-in-progress: false
jobs:
  source:
    if: github.event_name == 'workflow_dispatch' || vars.SOURCING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Source and save private candidates
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          FREESOUND_COMMERCIAL_ACCESS_CONFIRMED: ${{ vars.FREESOUND_COMMERCIAL_ACCESS_CONFIRMED }}
          SOURCING_ASSET_TOKEN: ${{ secrets.SOURCING_ASSET_TOKEN }}
          PROVIDERS: ${{ inputs.providers || vars.SOURCING_PROVIDERS || 'video' }}
          LIMIT: ${{ inputs.limit || '3' }}
        run: python scripts/source_assets.py --providers "$PROVIDERS" --limit "$LIMIT" --store-private
      - name: Record sourcing summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          summaries = sorted(Path('run/sourcing').glob('*/summary.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              if not summaries:
                  summary.write('No completed sourcing batch. Check provider keys and private-storage access.\n')
              else:
                  data = json.loads(summaries[-1].read_text())
                  summary.write(f"New video candidates: {data['new_videos']}\n\nNew audio candidates: {data['new_audio']}\n\n")
                  summary.write('The publishing pool was not changed. Check the sourcing step for confirmation of private storage transfer.\n')
          PY
