name: Refresh Audio Cache

# Runs on a slow cadence (monthly) to top up audio/ with CC0 tracks from
# Freesound. Deliberately separate from the daily job — see README for why:
# the daily pipeline only ever reads this cache, so a Freesound outage on
# any given day never blocks that day's video.

on:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-audio-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Fetch new CC0 tracks
        env:
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: python scripts/fetch_audio_pool.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/
          if git diff --cached --quiet; then
            echo "No new tracks, nothing to commit."
          else
            git commit -m "Refresh audio cache pool"
            git push
          fi
