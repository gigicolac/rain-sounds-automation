name: Post Pinned Comment
# Runs 15 minutes after each weekday release time in data/publish_schedule.json
# (kept in sync by tests/test_pinned_comment.py), plus a daily catch-up.
on:
  schedule:
    - cron: "15 12 * * 1,3"
      timezone: "America/New_York"
    - cron: "15 13 * * 2"
      timezone: "America/New_York"
    - cron: "15 9 * * 0,4,6"
      timezone: "America/New_York"
    - cron: "15 11 * * 5"
      timezone: "America/New_York"
    - cron: "45 17 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
concurrency:
  group: daily-rain-video
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Post comment on released videos
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          EXPECTED_YOUTUBE_CHANNEL_ID: ${{ vars.EXPECTED_YOUTUBE_CHANNEL_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/post_pinned_comment.py
